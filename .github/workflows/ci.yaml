name: CI - Build & Push Docker Images

on:
  push:

    branches: [ Main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build & Push api-gateway
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest ./api-gatway
        docker push ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest

    - name: Build & Push order-service
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/order-service:latest ./order-service
        docker push ${{ secrets.DOCKER_USERNAME }}/order-service:latest

    - name: Build & Push inventory-service
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/inventory-service:latest ./inventory-service
        docker push ${{ secrets.DOCKER_USERNAME }}/inventory-service:latest

    - name: Build & Push frontend
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend:latest ./frontend
        docker push ${{ secrets.DOCKER_USERNAME }}/frontend:latest
