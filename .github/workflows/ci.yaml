name: CI - Build, Scan & Push Docker Images (DevSecOps)

on:
  push:
    branches: [ Main ]

jobs:
  build:
    runs-on: ubuntu-latest 

    steps:

    # ----- 1. Checkout du code -----
    - name: Checkout repository
      uses: actions/checkout@v3


    # ----- 2. Login Docker Hub -----
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}


    # ---------------------------------------------------------
    # API GATWAY
    # ---------------------------------------------------------

    - name: Build api-gateway
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest ./api-gatway

    - name: Scan api-gateway (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: "${{ secrets.DOCKER_USERNAME }}/api-gateway:latest"
        severity: "CRITICAL,HIGH"
        exit-code: "1"

    - name: Push api-gateway
      run: docker push ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest


    # ---------------------------------------------------------
    # ORDER SERVICE
    # ---------------------------------------------------------

    - name: Build order-service
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/order-service:latest ./order-service

    - name: Scan order-service (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: "${{ secrets.DOCKER_USERNAME }}/order-service:latest"
        severity: "CRITICAL,HIGH"
        exit-code: "1"

    - name: Push order-service
      run: docker push ${{ secrets.DOCKER_USERNAME }}/order-service:latest


    # ---------------------------------------------------------
    # INVENTORY SERVICE
    # ---------------------------------------------------------

    - name: Build inventory-service
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/inventory-service:latest ./inventory-service

    - name: Scan inventory-service (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: "${{ secrets.DOCKER_USERNAME }}/inventory-service:latest"
        severity: "CRITICAL,HIGH"
        exit-code: "1"

    - name: Push inventory-service
      run: docker push ${{ secrets.DOCKER_USERNAME }}/inventory-service:latest


    # ---------------------------------------------------------
    # FRONTEND
    # ---------------------------------------------------------

    - name: Build frontend
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend:latest ./frontend

    - name: Scan frontend (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: "${{ secrets.DOCKER_USERNAME }}/frontend:latest"
        severity: "CRITICAL,HIGH"
        exit-code: "1"

    - name: Push frontend
      run: docker push ${{ secrets.DOCKER_USERNAME }}/frontend:latest
