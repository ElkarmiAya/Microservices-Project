apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: order-service-monitor
  namespace: monitoring
  labels:
    release: kube-monitor
spec:
  selector:
    matchLabels:
      app: order-service
  namespaceSelector:
    matchNames:
      - microservices
  endpoints:
    - port: http
      path: /api/metrics
      interval: 15s
