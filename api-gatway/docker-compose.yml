version: '3.8'

services:
  # API Gateway (NGINX)
  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - order-service
      - inventory-service
    networks:
      - microservices-network
    restart: unless-stopped

  # Order Service (Node.js)
  order-service:
    build: ../order-service
    container_name: order-service
    environment:
      - PORT=8001
      - NODE_ENV=production
      - DB_HOST=postgres-order
      - DB_PORT=5432
      - DB_NAME=order_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - INVENTORY_SERVICE_URL=http://inventory-service:8000
    depends_on:
      postgres-order:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

  # Inventory Service (Python FastAPI)
  inventory-service:
    build: ../inventory-service
    container_name: inventory-service
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:postgres@postgres-inventory:5432/inventory_db
    depends_on:
      postgres-inventory:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

  # PostgreSQL pour Order Service
  postgres-order:
    image: postgres:15-alpine
    container_name: postgres_db_order
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    networks:
      - microservices-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL pour Inventory Service
  postgres-inventory:
    image: postgres:15-alpine
    container_name: postgres_db_inventory
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_inventory_data:/var/lib/postgresql/data
    networks:
      - microservices-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend
  frontend:
    image: nginx:alpine
    container_name: frontend
    ports:
      - "3002:80"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
    depends_on:
      - api-gateway
    networks:
      - microservices-network
    restart: unless-stopped

networks:
  microservices-network:
    driver: bridge

volumes:
  postgres_order_data:
  postgres_inventory_data:
