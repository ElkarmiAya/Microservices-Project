events {
    worker_connections 1024;
}

http {
    # Configuration de base
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Upstream pour API Gateway
    upstream api_gateway {
        server api-gateway:80;
    }

    # Serveur principal
    server {
        listen 80;
        server_name _;

        # Racine pour les fichiers statiques HTML/CSS/JS
        root /usr/share/nginx/html;
        index index.html;

        # Servir les fichiers statiques (votre frontend)
        location / {
            try_files $uri $uri/ /index.html;
            
            # Headers de sécurité
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }

        # Proxy vers API Gateway pour toutes les requêtes /api/*
        location /api/ {
            # Supprimer les headers CORS du backend pour éviter les doublons
            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Methods';
            proxy_hide_header 'Access-Control-Allow-Headers';
            proxy_hide_header 'Access-Control-Allow-Credentials';

            # Gestion des requêtes OPTIONS (preflight CORS)
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            # Headers CORS pour toutes les réponses
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;

            # Proxy vers l'API Gateway
            proxy_pass http://api_gateway/api/;
            proxy_http_version 1.1;
            
            # Headers proxy
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Désactiver le buffering pour les réponses en temps réel
            proxy_buffering off;
        }

        # Health check local
        location /frontend-health {
            access_log off;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header Content-Type application/json;
            return 200 '{"status": "frontend healthy", "timestamp": "$date_gmt"}';
        }
    }
}